[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchlight"
version = "0.1.0"
description = "Interactive full-text PDF search, fuzzy discovery, and document preview engine"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["pdf", "search", "pdfgrep", "fzf", "tui", "cli", "frost", "iceberg", "viewer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "prism",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[project.scripts]
searchlight = "searchlight.cli:main"
searchlight-mcp = "searchlight.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["searchlight*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/ui.py" = ["F401"]
"**/ui/*.py" = ["F401"]
"**/ui/__init__.py" = ["F401"]
"**/tests/*" = ["F401", "F841"]
